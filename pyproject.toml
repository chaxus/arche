[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "arche"
version = "0.1.0"
description = "Hand-write a modern dense decoder (Llama 3.2 lineage) from first principles."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "chaxus" }]
dependencies = [
  "torch>=2.0",
  "tiktoken>=0.5",
  "transformers>=4.40",
  "huggingface_hub>=0.23",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.setuptools.packages.find]
include = ["arche*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
